<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEOUL SNAP — Kamera HP</title><style>body{font-family:system-ui;background:#f7f3ec;color:#27231f;margin:0;padding:24px;max-width:650px;margin:auto}h1{letter-spacing:.08em}button,input{font:inherit;padding:12px;border-radius:12px;border:1px solid #cfc6ba}button{background:#27231f;color:white;cursor:pointer}video{width:100%;background:#ddd;border-radius:18px;margin:16px 0;max-height:65vh;object-fit:cover}.card{background:#fffaf3;padding:18px;border-radius:20px;margin:16px 0}small{color:#655e55}.row{display:flex;gap:8px;flex-wrap:wrap}input{min-width:0;flex:1}</style></head><body><h1>SEOUL SNAP</h1><h2>Kamera HP</h2><p>Halaman ini mengirim live preview kamera HP ke PC lewat browser. Buka halaman ini dari alamat HTTPS yang sama dengan halaman penerima PC.</p><div class="card"><label>ID koneksi PC</label><div class="row"><input id="peerId" placeholder="Masukkan ID dari layar PC"><button id="connect">Hubungkan</button></div><p id="status"><small>Belum terhubung.</small></p></div><video id="video" autoplay playsinline muted></video><button id="start">Aktifkan kamera HP</button><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
let stream,peer,call;const status=document.querySelector('#status'),video=document.querySelector('#video');
document.querySelector('#start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;status.textContent='Kamera aktif. Masukkan ID PC lalu Hubungkan.';if(call)call.answer(stream)}catch(e){status.textContent='Kamera gagal dibuka: '+e.message+'. Pastikan halaman HTTPS dan izin kamera diberikan.'}};
document.querySelector('#connect').onclick=()=>{const id=document.querySelector('#peerId').value.trim();if(!id)return alert('Masukkan ID PC terlebih dahulu.');if(!peer){peer=new Peer();peer.on('open',()=>dial(id));peer.on('error',e=>status.textContent='Koneksi gagal: '+e.type)}else dial(id)};
function dial(id){if(!stream){status.textContent='Tekan Aktifkan kamera HP terlebih dahulu.';return}call=peer.call(id,stream);call.on('close',()=>status.textContent='Koneksi terputus.');status.textContent='Menghubungkan ke PC…'}
</script></body></html>
