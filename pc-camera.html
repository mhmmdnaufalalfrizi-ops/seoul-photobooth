<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEOUL SNAP — Penerima Kamera</title><style>body{font-family:system-ui;background:#f7f3ec;color:#27231f;margin:0;padding:24px;max-width:900px;margin:auto}h1{letter-spacing:.08em}.card{background:#fffaf3;padding:18px;border-radius:20px;margin:16px 0}video{width:100%;max-height:72vh;object-fit:contain;background:#ddd;border-radius:18px}button{font:inherit;padding:12px;border:0;border-radius:12px;background:#27231f;color:white;cursor:pointer}.id{font-size:1.3rem;font-weight:700;word-break:break-all}small{color:#655e55}</style></head><body><h1>SEOUL SNAP</h1><h2>Live preview kamera HP</h2><div class="card"><p>ID koneksi PC kamu:</p><div class="id" id="id">Membuat ID…</div><button id="copy">Salin ID</button><p id="status"><small>Buka <b>phone-camera.html</b> di HP, aktifkan kamera, lalu masukkan ID ini.</small></p></div><video id="video" autoplay playsinline muted></video><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>const idEl=document.querySelector('#id'),status=document.querySelector('#status'),video=document.querySelector('#video');const peer=new Peer();peer.on('open',id=>{idEl.textContent=id;status.textContent='Siap. Buka halaman kamera di HP dan masukkan ID di atas.'});peer.on('call',call=>{call.answer();call.on('stream',stream=>{video.srcObject=stream;status.textContent='Kamera HP terhubung — live preview aktif.'});call.on('close',()=>status.textContent='Kamera terputus.')});peer.on('error',e=>status.textContent='Koneksi error: '+e.type);document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(idEl.textContent);status.textContent='ID disalin. Kirim ke HP.'}catch{status.textContent='Salin ID secara manual.'}};</script></body></html>
